<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Nathan | Portfolio</title>
    <meta
      name="description"
      content="Portfolio de Simon Nathan — projets, compétences et contact."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="accueil">
      <section class="hero">
        <canvas class="hero-canvas" aria-hidden="true"></canvas>
      </section>

      <section class="sky-section">
        <div class="sky-content"></div>
      </section>

      <section class="cloud-plain-section">
        <div class="cloud-layer cloud-layer--plain" aria-hidden="true">
          <img class="cloud cloud-plain-1" src="image/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-2" src="image/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-3" src="image/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-4" src="image/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-5" src="image/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
        </div>
      </section>

      <section class="sea-transition-section">
        <svg class="water-filter-defs" aria-hidden="true">
          <filter id="water-turbulence" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence
              id="water-noise"
              type="fractalNoise"
              baseFrequency="0.012 0.045"
              numOctaves="3"
              seed="8"
              result="noise"
            >
              <animate
                attributeName="baseFrequency"
                dur="24s"
                values="0.012 0.045;0.022 0.065;0.012 0.045"
                repeatCount="indefinite"
              />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </svg>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
