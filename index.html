<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Nathan | Portfolio</title>
    <meta
      name="description"
      content="Portfolio de Simon Nathan — projets, compétences et contact."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body>
    <main id="accueil">
      <section class="scene hero">
        <div class="scene__decor">
          <canvas class="hero-canvas" aria-hidden="true"></canvas>
        </div>
        <div class="container scene__content"></div>
      </section>

      <section class="scene sky-section">
        <div class="scene__decor"></div>
        <div class="container scene__content">
          <div class="sky-content"></div>
        </div>
      </section>

      <section class="scene cloud-plain-section">
        <div class="scene__decor">
          <div class="cloud-layer cloud-layer--plain" aria-hidden="true">
          <img class="cloud cloud-plain-1" src="assets/images/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-2" src="assets/images/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-3" src="assets/images/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-4" src="assets/images/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          <img class="cloud cloud-plain-5" src="assets/images/special-3d-rendering-smooth-clouds-flowing-shapes-isolated-transparent-backgrounds-png.webp" alt="" />
          </div>
        </div>
        <div class="container scene__content"></div>
      </section>

      <section class="scene sea-transition-section">
        <div class="scene__decor">
          <div class="island-layer" aria-hidden="true">
          <img
            class="island island--left"
            src="assets/images/lush-tropical-island-with-palm-trees-and-sandy-shore-cut-out-stock-png.webp"
            alt=""
          />
          <img
            class="island island--right"
            src="assets/images/lush-tropical-island-with-palm-trees-and-sandy-shore-cut-out-stock-png.webp"
            alt=""
          />
          </div>

          <svg class="water-filter-defs" aria-hidden="true">
          <filter id="water-turbulence" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence
              id="water-noise"
              type="fractalNoise"
              baseFrequency="0.012 0.045"
              numOctaves="3"
              seed="8"
              result="noise"
            >
              <animate
                attributeName="baseFrequency"
                dur="24s"
                values="0.012 0.045;0.022 0.065;0.012 0.045"
                repeatCount="indefinite"
              />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          </svg>
        </div>
        <div class="container scene__content"></div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
