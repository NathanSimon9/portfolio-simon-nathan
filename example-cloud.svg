<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nuage réaliste">
  <defs>
    <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <linearGradient id="cloudGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dfefff" stop-opacity="0.9"/>
    </linearGradient>
    <animateTransform xlink:href="#cloudGroup" attributeName="transform" type="translate" values="0 0; 18 4; -10 2; 0 0" dur="18s" repeatCount="indefinite"/>
    <animateTransform xlink:href="#cloudGroup" attributeName="transform" additive="sum" type="scale" values="1 1; 1.02 1.01; 0.99 1; 1 1" dur="24s" repeatCount="indefinite"/>
  </defs>

  <g id="cloudGroup" filter="url(#cloudBlur)" opacity="0.95">
    <ellipse cx="170" cy="125" rx="120" ry="42" fill="url(#cloudGrad)"/>
    <ellipse cx="260" cy="105" rx="110" ry="48" fill="url(#cloudGrad)"/>
    <ellipse cx="350" cy="120" rx="104" ry="40" fill="url(#cloudGrad)"/>
    <ellipse cx="430" cy="110" rx="118" ry="46" fill="url(#cloudGrad)"/>
    <ellipse cx="500" cy="126" rx="100" ry="40" fill="url(#cloudGrad)"/>
    <ellipse cx="305" cy="155" rx="255" ry="46" fill="url(#cloudGrad)"/>
  </g>
</svg>
